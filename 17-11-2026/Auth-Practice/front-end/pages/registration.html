<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b4386" />
  <title>Create Customer Account</title>
  <link rel="stylesheet" href="../css/registration.css" />
  <script src="../js/registration.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <section class="registration-card" aria-labelledby="page-title">
      <a class="back-link" href="/pages/login.html">&larr; Back to login</a>
      <h1 id="page-title">CREATE ACCOUNT</h1>
      <p class="intro">Register to access your customer account.</p>

      <form id="registration-form" novalidate>
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" autocomplete="name" minlength="2" maxlength="100" placeholder="Your name" required />

        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="255" placeholder="you@example.com" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" placeholder="At least 8 characters" required />

        <label for="confirm-password">Confirm password</label>
        <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="72" placeholder="Re-enter your password" required />

        <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
        <button id="register-button" type="submit">CREATE ACCOUNT</button>
      </form>

      <p class="login-prompt">Already have an account? <a href="/pages/login.html">Log in</a></p>
    </section>
  </main>
</body>
</html>
